name: IndexNow

# Vercel reports each deployment back to GitHub; ping IndexNow once production is live.
on: deployment_status

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
